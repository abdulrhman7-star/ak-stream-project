name: scheduled-fetch-and-artifact

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # every hour

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.API_BASE }}
      DATA_DIR: data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install psycopg2-binary pymongo || true

      - name: Run Python fetch (creates data/)
        run: |
          mkdir -p $DATA_DIR
          python scripts/fetch_all.py

      - name: Run Node fetch (optional)
        run: |
          if command -v node >/dev/null 2>&1; then
            node --version || true
            node scripts/fetch_all.js || true
          fi

      - name: Upload fetched JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-fetched-json
          path: |
            data/*.latest.json
            data/*.json

      - name: Optionally run ETL to Postgres (if POSTGRES_URL secret provided)
        if: ${{ secrets.POSTGRES_URL != '' }}
        run: |
          echo "Running Postgres ETL"
          POSTGRES_URL="${{ secrets.POSTGRES_URL }}" DATA_DIR=$DATA_DIR python scripts/etl_postgres.py

      - name: Optionally run ETL to Mongo (if MONGO_URI secret provided)
        if: ${{ secrets.MONGO_URI != '' }}
        run: |
          echo "Running Mongo ETL"
          MONGO_URI="${{ secrets.MONGO_URI }}" DATA_DIR=$DATA_DIR python scripts/etl_mongo.py
