<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="منصة أفلام ومسلسلات"
    >

    <title>AK Stream</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b12;
            --surface: #111621;
            --surface-2: #171d2a;
            --border: rgba(255,255,255,.08);
            --text: #f5f7fb;
            --muted: #9ba5b5;
            --primary: #e50914;
            --primary-hover: #ff1a25;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 14px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(229,9,20,.12),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================================
           Header
        ========================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(18px);
            background: rgba(8,11,18,.88);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            white-space: nowrap;
        }

        .logo span {
            color: var(--primary);
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 13px 45px 13px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .search-box input:focus {
            border-color: rgba(229,9,20,.65);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .refresh-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .refresh-btn:hover {
            background: var(--surface-2);
        }

        /* =========================================
           Status
        ========================================= */

        .status-bar {
            max-width: 1400px;
            margin: auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
        }

        .dot.ready {
            background: var(--success);
        }

        .dot.error {
            background: var(--primary);
        }

        /* =========================================
           Main
        ========================================= */

        main {
            max-width: 1400px;
            margin: auto;
            padding: 10px 20px 60px;
        }

        .hero {
            padding: 35px 0 25px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 48px);
        }

        .hero p {
            color: var(--muted);
            margin: 0;
        }

        /* =========================================
           Tabs
        ========================================= */

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            padding: 10px 18px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* =========================================
           Loading
        ========================================= */

        .loading {
            display: none;
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--primary);
            animation: spin .8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           Grid
        ========================================= */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(170px, 1fr)
                );
            gap: 18px;
        }

        .card {
            min-width: 0;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(229,9,20,.45);
            box-shadow:
                0 15px 35px rgba(0,0,0,.25);
        }

        .poster {
            position: relative;
            aspect-ratio: 2 / 3;
            background: #0e131c;
            overflow: hidden;
        }

        .poster img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .3s ease;
        }

        .card:hover .poster img {
            transform: scale(1.04);
        }

        .type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,.75);
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 11px;
        }

        .rating {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,.8);
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 12px;
        }

        .card-body {
            padding: 12px;
        }

        .title {
            font-size: 15px;
            line-height: 1.5;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 45px;
        }

        .meta {
            display: flex;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
            margin-top: 8px;
        }

        .quality {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: #dce2eb;
        }

        /* =========================================
           Pagination
        ========================================= */

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 35px;
        }

        .page-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: white;
            padding: 10px 17px;
            border-radius: 10px;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--surface-2);
        }

        .page-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .page-number {
            color: var(--muted);
        }

        /* =========================================
           Empty / Error
        ========================================= */

        .message {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .message.show {
            display: block;
        }

        /* =========================================
           Responsive
        ========================================= */

        @media (max-width: 700px) {

            .header-inner {
                flex-wrap: wrap;
                gap: 10px;
            }

            .logo {
                width: 100%;
            }

            .search-box {
                width: calc(100% - 55px);
            }

            .refresh-btn {
                width: 45px;
                padding: 10px;
            }

            .status-bar {
                overflow-x: auto;
                white-space: nowrap;
            }

            .grid {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
                gap: 12px;
            }

            .card-body {
                padding: 9px;
            }

            .title {
                font-size: 13px;
            }
        }

        @media (min-width: 1000px) {

            .grid {
                grid-template-columns:
                    repeat(
                        6,
                        minmax(0, 1fr)
                    );
            }
        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            AK <span>STREAM</span>
        </div>

        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن فيلم أو مسلسل..."
                autocomplete="off"
            >

        </div>

        <button
            class="refresh-btn"
            id="refreshBtn"
            title="تحديث البيانات"
        >
            ↻
        </button>

    </div>

</header>


<div class="status-bar">

    <div class="status">

        <span
            id="statusDot"
            class="dot"
        ></span>

        <span id="statusText">
            جاري الاتصال...
        </span>

    </div>

    <div>
        أفلام:
        <strong id="moviesCount">0</strong>
    </div>

    <div>
        مسلسلات:
        <strong id="seriesCount">0</strong>
    </div>

</div>


<main>

    <section class="hero">

        <h1 id="pageTitle">
            الأفلام والمسلسلات
        </h1>

        <p id="pageDescription">
            تصفح الكتالوج وابحث عن المحتوى الذي تريده.
        </p>

    </section>


    <div class="tabs">

        <button
            class="tab active"
            data-type="movies"
        >
            🎬 الأفلام
        </button>

        <button
            class="tab"
            data-type="series"
        >
            📺 المسلسلات
        </button>

    </div>


    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        <div id="loadingText">
            جاري تحميل البيانات...
        </div>

    </div>


    <div
        id="grid"
        class="grid"
    ></div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="pagination"
        class="pagination"
    >

        <button
            id="prevBtn"
            class="page-btn"
        >
            السابق
        </button>

        <span
            id="pageNumber"
            class="page-number"
        >
            صفحة 1
        </span>

        <button
            id="nextBtn"
            class="page-btn"
        >
            التالي
        </button>

    </div>

</main>


<script>

    // ========================================================
    // Configuration
    // ========================================================

    const API_BASE = "";

    const PAGE_SIZE = 24;

    let currentType = "movies";

    let currentPage = 0;

    let totalPages = 0;

    let searchTimer = null;

    let searchMode = false;


    // ========================================================
    // Elements
    // ========================================================

    const grid =
        document.getElementById("grid");

    const loading =
        document.getElementById("loading");

    const loadingText =
        document.getElementById("loadingText");

    const message =
        document.getElementById("message");

    const prevBtn =
        document.getElementById("prevBtn");

    const nextBtn =
        document.getElementById("nextBtn");

    const pageNumber =
        document.getElementById("pageNumber");

    const searchInput =
        document.getElementById("searchInput");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const statusText =
        document.getElementById("statusText");

    const statusDot =
        document.getElementById("statusDot");

    const moviesCount =
        document.getElementById("moviesCount");

    const seriesCount =
        document.getElementById("seriesCount");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageDescription =
        document.getElementById("pageDescription");


    // ========================================================
    // Helpers
    // ========================================================

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function setLoading(show, text = "جاري التحميل...") {

        loadingText.textContent = text;

        loading.classList.toggle(
            "show",
            show
        );
    }


    function showMessage(text) {

        message.textContent = text;

        message.classList.add(
            "show"
        );
    }


    function hideMessage() {

        message.classList.remove(
            "show"
        );

        message.textContent = "";
    }


    // ========================================================
    // Status
    // ========================================================

    async function loadStatus() {

        try {

            const response =
                await fetch(
                    `${API_BASE}/api/status`,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error("Status failed");
            }

            const status =
                await response.json();

            moviesCount.textContent =
                status.movies || 0;

            seriesCount.textContent =
                status.series || 0;

            if (status.loading) {

                statusText.textContent =
                    "جاري جلب البيانات...";

                statusDot.className =
                    "dot";

            } else if (status.ready) {

                statusText.textContent =
                    "الخادم جاهز";

                statusDot.className =
                    "dot ready";

            } else {

                statusText.textContent =
                    "في انتظار البيانات";

                statusDot.className =
                    "dot";
            }

        } catch (error) {

            statusText.textContent =
                "تعذر الاتصال بالخادم";

            statusDot.className =
                "dot error";
        }
    }


    // ========================================================
    // Load Catalog
    // ========================================================

    async function loadCatalog() {

        searchMode = false;

        hideMessage();

        setLoading(
            true,
            "جاري تحميل العناصر..."
        );

        grid.innerHTML = "";

        try {

            const endpoint =
                currentType === "movies"
                    ? "/api/movies"
                    : "/api/series";

            const url =
                `${API_BASE}${endpoint}` +
                `?page=${currentPage}` +
                `&limit=${PAGE_SIZE}`;

            const response =
                await fetch(url, {
                    cache: "no-store"
                });

            if (response.status === 503) {

                showMessage(
                    "البيانات لا تزال تُحمّل في الخلفية. سيتم تحديث الصفحة تلقائيًا."
                );

                return;
            }

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const result =
                await response.json();

            if (!result.success) {

                showMessage(
                    result.error ||
                    "حدث خطأ أثناء تحميل البيانات"
                );

                return;
            }

            renderItems(
                result.data || []
            );

            totalPages =
                result.totalPages || 0;

            updatePagination();

            if (
                !result.data ||
                result.data.length === 0
            ) {

                showMessage(
                    "لا توجد عناصر في هذه الصفحة."
                );
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "تعذر الاتصال بالخادم."
            );

        } finally {

            setLoading(false);
        }
    }


    // ========================================================
    // Search
    // ========================================================

    async function searchCatalog(query) {

        const q =
            query.trim();

        if (!q) {

            currentPage = 0;

            await loadCatalog();

            return;
        }

        searchMode = true;

        hideMessage();

        setLoading(
            true,
            `جاري البحث عن "${q}"...`
        );

        grid.innerHTML = "";

        try {

            const url =
                `${API_BASE}/api/search` +
                `?q=${encodeURIComponent(q)}` +
                `&limit=100`;

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Search failed"
                );
            }

            const result =
                await response.json();

            renderItems(
                result.data || []
            );

            document.getElementById(
                "pageTitle"
            ).textContent =
                `نتائج البحث: ${q}`;

            document.getElementById(
                "pageDescription"
            ).textContent =
                `تم العثور على ${result.total || 0} نتيجة`;

            document.getElementById(
                "pagination"
            ).style.display = "none";

            if (
                !result.data ||
                result.data.length === 0
            ) {

                showMessage(
                    "لم يتم العثور على نتائج."
                );
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء البحث."
            );

        } finally {

            setLoading(false);
        }
    }


    // ========================================================
    // Render cards
    // ========================================================

    function renderItems(items) {

        grid.innerHTML = "";

        items.forEach(item => {

            const card =
                document.createElement("article");

            card.className = "card";

            const title =
                escapeHtml(
                    item.title || "بدون عنوان"
                );

            const image =
                escapeHtml(
                    item.image || ""
                );

            const year =
                escapeHtml(
                    item.year || "----"
                );

            const rating =
                escapeHtml(
                    item.rating || "0.0"
                );

            const quality =
                escapeHtml(
                    item.quality || ""
                );

            const type =
                item.type === "series"
                    ? "مسلسل"
                    : "فيلم";

            card.innerHTML = `

                <div class="poster">

                    ${
                        image
                        ?
                        `
                        <img
                            src="${image}"
                            alt="${title}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >
                        `
                        :
                        `
                        <div style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#777;
                            font-size:40px;
                        ">
                            🎬
                        </div>
                        `
                    }

                    <div class="type-badge">
                        ${type}
                    </div>

                    <div class="rating">
                        ⭐ ${rating}
                    </div>

                </div>

                <div class="card-body">

                    <div class="title">
                        ${title}
                    </div>

                    <div class="meta">
                        <span>
                            ${year}
                        </span>
                    </div>

                    ${
                        quality
                        ?
                        `
                        <div class="quality">
                            ${quality}
                        </div>
                        `
                        :
                        ""
                    }

                </div>
            `;

            grid.appendChild(card);
        });
    }


    // ========================================================
    // Pagination
    // ========================================================

    function updatePagination() {

        if (searchMode) {
            return;
        }

        document.getElementById(
            "pagination"
        ).style.display = "flex";

        pageNumber.textContent =
            `صفحة ${currentPage + 1}` +
            (
                totalPages
                    ? ` من ${totalPages}`
                    : ""
            );

        prevBtn.disabled =
            currentPage <= 0;

        nextBtn.disabled =
            totalPages > 0
                ? currentPage >= totalPages - 1
                : true;
    }


    prevBtn.addEventListener(
        "click",
        async () => {

            if (currentPage <= 0) {
                return;
            }

            currentPage--;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            await loadCatalog();
        }
    );


    nextBtn.addEventListener(
        "click",
        async () => {

            if (
                totalPages &&
                currentPage >= totalPages - 1
            ) {
                return;
            }

            currentPage++;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            await loadCatalog();
        }
    );


    // ========================================================
    // Tabs
    // ========================================================

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    document
                        .querySelectorAll(".tab")
                        .forEach(tab => {
                            tab.classList.remove(
                                "active"
                            );
                        });

                    button.classList.add(
                        "active"
                    );

                    currentType =
                        button.dataset.type;

                    currentPage = 0;

                    pageTitle.textContent =
                        currentType === "movies"
                            ? "الأفلام"
                            : "المسلسلات";

                    pageDescription.textContent =
                        currentType === "movies"
                            ? "تصفح جميع الأفلام المتاحة."
                            : "تصفح جميع المسلسلات المتاحة.";

                    searchInput.value = "";

                    await loadCatalog();
                }
            );
        });


    // ========================================================
    // Search Input
    // ========================================================

    searchInput.addEventListener(
        "input",
        () => {

            clearTimeout(searchTimer);

            const value =
                searchInput.value.trim();

            searchTimer =
                setTimeout(
                    () => {

                        if (value) {

                            searchCatalog(
                                value
                            );

                        } else {

                            currentPage = 0;

                            pageTitle.textContent =
                                currentType === "movies"
                                    ? "الأفلام"
                                    : "المسلسلات";

                            pageDescription.textContent =
                                "تصفح الكتالوج وابحث عن المحتوى الذي تريده.";

                            loadCatalog();
                        }

                    },
                    400
                );
        }
    );


    // ========================================================
    // Refresh
    // ========================================================

    refreshBtn.addEventListener(
        "click",
        async () => {

            refreshBtn.disabled = true;

            refreshBtn.textContent =
                "⟳";

            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/refresh`,
                        {
                            method: "POST"
                        }
                    );

                const result =
                    await response.json();

                if (result.success) {

                    statusText.textContent =
                        "بدأ تحديث البيانات...";

                    statusDot.className =
                        "dot";

                } else {

                    alert(
                        result.message ||
                        "تعذر بدء التحديث"
                    );
                }

            } catch (error) {

                alert(
                    "تعذر الاتصال بالخادم"
                );

            } finally {

                setTimeout(
                    () => {

                        refreshBtn.disabled =
                            false;

                        refreshBtn.textContent =
                            "↻";

                        loadStatus();

                    },
                    1000
                );
            }
        }
    );


    // ========================================================
    // Auto status polling
    // ========================================================

    setInterval(
        loadStatus,
        10000
    );


    // ========================================================
    // Initial
    // ========================================================

    async function init() {

        await loadStatus();

        await loadCatalog();

    }

    init();

</script>

</body>

</html>
